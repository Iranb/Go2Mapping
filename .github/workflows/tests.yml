name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Offline checks (${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          brew install portaudio
          export CPPFLAGS="-I$(brew --prefix portaudio)/include"
          export LDFLAGS="-L$(brew --prefix portaudio)/lib"
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify imports and HTTP assets without a robot
        run: python work/verify_install.py
      - name: Run public Python regression suite
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          import unittest

          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item

          discovered = list(cases(unittest.defaultTestLoader.discover('work', pattern='test_go2_*.py')))
          assert discovered, 'No regression tests found'
          shard = int(os.environ['TEST_SHARD'])
          selected = discovered[shard::3]
          print(f'Shard {shard}: {len(selected)} of {len(discovered)} discovered tests', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Run JavaScript UI scenarios
        run: |
          node work/test_go2_navigation_ui.mjs
          node work/test_go2_spatial_ui.mjs
      - name: Check publication contents
        run: python work/check_public_source.py
